<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitCore — Миграция</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0d12;color:#f0f0f0;font-family:-apple-system,sans-serif;padding:24px 20px;min-height:100vh}
  h1{font-size:22px;font-weight:800;color:#c8f060;margin-bottom:4px}
  p.sub{font-size:13px;color:#9090a8;margin-bottom:24px}
  .card{background:#1a1a24;border-radius:16px;padding:20px;margin-bottom:14px}
  .card h2{font-size:12px;font-weight:700;color:#c8f060;margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
  label{display:block;font-size:12px;color:#9090a8;margin-bottom:5px}
  input,select{width:100%;background:#22222e;border:1px solid #33333f;border-radius:10px;padding:11px 14px;color:#f0f0f0;font-size:15px;outline:none;margin-bottom:12px}
  .btn{width:100%;background:#c8f060;color:#0d0d12;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
  .btn:disabled{opacity:.5}
  .log{background:#13131a;border-radius:12px;padding:14px;font-size:13px;line-height:1.8;min-height:60px;color:#9090a8;white-space:pre-wrap}
  .ok{color:#c8f060}.err{color:#ff6b6b}.info{color:#60b8f0}
  .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #22222e;font-size:13px}
  .row:last-child{border-bottom:none}
  .val{color:#c8f060;font-weight:600}
</style>
</head>
<body>
<h1>FitCore Migration</h1>
<p class="sub">Открой эту страницу на том же устройстве и домене где работает FitCore.</p>

<div class="card">
  <h2>📱 Данные на устройстве</h2>
  <div id="local-data"><span style="color:#5a5a72;font-style:italic;font-size:13px">Читаю...</span></div>
</div>

<div class="card">
  <h2>👤 Создать аккаунт</h2>
  <label>Имя</label>
  <input type="text" id="inp-name" placeholder="Даниил"/>
  <label>Номер телефона</label>
  <input type="tel" id="inp-phone" placeholder="+79911745113"/>
  <label>Пароль</label>
  <input type="password" id="inp-pass" placeholder="Придумай пароль"/>
  <label>Программа</label>
  <select id="inp-prog">
    <option value="combined">Объединённая (кор + спина чередование)</option>
    <option value="main">Только кор</option>
    <option value="back">Только спина и осанка</option>
  </select>
  <button class="btn" id="btn-go" onclick="doMigrate()">Создать аккаунт и перенести данные</button>
</div>

<div class="card">
  <h2>📋 Лог</h2>
  <div class="log" id="log">Жду...</div>
</div>

<script>
const SB_URL = 'https://yiqipulgofoschkccaxr.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpcWlwdWxnb2Zvc2Noa2NjYXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMjExMjksImV4cCI6MjA4OTg5NzEyOX0.Op4iBjGSOBcKb4pkVSd75_l8Fle3Cz15nBh9KF21YhI';
const H = {'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'};

function sb(path, method='GET', body=null) {
  return fetch(SB_URL+'/rest/v1/'+path, {method, headers:H, body:body?JSON.stringify(body):null}).then(r=>r.json());
}

function log(msg, cls='') {
  const el = document.getElementById('log');
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
}

window.onload = function() {
  const done = JSON.parse(localStorage.getItem('fc_done')||'[]');
  const doneBack = JSON.parse(localStorage.getItem('fc_done_back')||'[]');
  const doneCombined = JSON.parse(localStorage.getItem('fc_done_combined')||'[]');
  // Считаем тренировочные дни (без 'done_N' псевдодат и реальные)
  const mainCount = done.length;
  const backCount = doneBack.length;
  const combinedCount = doneCombined.length;
  // Пересчитываем в combined: mainCount + backCount дней чередованием
  const migratedCombined = mainCount + backCount;
  const el = document.getElementById('local-data');
  if (mainCount===0 && backCount===0 && combinedCount===0) {
    el.innerHTML = '<span style="color:#5a5a72;font-style:italic;font-size:13px">Данных не найдено — возможно не тот домен</span>';
  } else {
    el.innerHTML = [
      ['Кор (основная)', mainCount + ' записей'],
      ['Спина и осанка', backCount + ' записей'],
      ['Уже combined', combinedCount + ' записей'],
      ['Будет перенесено как combined', (combinedCount > 0 ? combinedCount : migratedCombined) + ' дней'],
    ].map(([k,v])=>`<div class="row"><span>${k}</span><span class="val">${v}</span></div>`).join('');
  }
};

async function doMigrate() {
  const name = document.getElementById('inp-name').value.trim();
  const phone = document.getElementById('inp-phone').value.trim().replace(/\s/g,'');
  const pass = document.getElementById('inp-pass').value.trim();
  const prog = document.getElementById('inp-prog').value;
  if (!name||!phone||!pass) { alert('Заполни все поля'); return; }
  const btn = document.getElementById('btn-go');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';

  log('Создаю аккаунт...', 'info');
  const res = await sb('fc_users', 'POST', {name, phone, password:pass, program_key:prog, profile:{}});
  if (!res||!res[0]) {
    if (res&&res.error&&res.error.code==='23505') log('❌ Номер уже зарегистрирован', 'err');
    else log('❌ Ошибка: '+JSON.stringify(res?.error), 'err');
    btn.disabled = false; return;
  }
  const userId = res[0].id;
  log(`✅ Аккаунт создан (${userId.slice(0,8)}...)`, 'ok');

  // Определяем что мигрировать
  const done = JSON.parse(localStorage.getItem('fc_done')||'[]');
  const doneBack = JSON.parse(localStorage.getItem('fc_done_back')||'[]');
  const doneCombined = JSON.parse(localStorage.getItem('fc_done_combined')||'[]');

  let days = [];
  if (doneCombined.length > 0) {
    // Уже есть combined — берём его
    days = doneCombined;
    log(`Найдено ${days.length} combined дней`, 'info');
  } else {
    // Пересчитываем из main+back: чередуем
    let mi=0, bi=0;
    while (mi<done.length || bi<doneBack.length) {
      if (mi<done.length) { days.push(days.length); mi++; }
      if (bi<doneBack.length) { days.push(days.length); bi++; }
    }
    log(`Пересчитал: ${done.length} кор + ${doneBack.length} спина → ${days.length} combined дней`, 'info');
  }

  log(`Загружаю ${days.length} тренировок в Supabase...`, 'info');
  for (let i=0; i<days.length; i++) {
    await sb('fc_progress', 'POST', {user_id:userId, program_key:'combined', day_index:i});
  }
  log(`✅ Перенесено ${days.length} тренировок`, 'ok');

  // Сохраняем в localStorage для автологина
  localStorage.setItem('fc_user_id', userId);
  localStorage.setItem('fc_user_name', name);
  localStorage.setItem('fc_user_phone', phone);
  localStorage.setItem('fc_user_pass', pass);
  localStorage.setItem('fc_done_combined', JSON.stringify(days.map((_,i)=>i)));

  log('', '');
  log(`🎉 Готово! Ты на дне ${days.length} из 51`, 'ok');
  log(`Логин: ${phone} / пароль: ${pass}`, 'ok');
  log('Теперь открой обновлённый FitCore — войдёшь автоматически', 'info');
}
</script>
</body>
</html>
